name: Build Dendron Static Site

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Restore Node modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .next/*
            !.next/.next/cache
            !.next/.env.*
          key: ${{ runner.os }}-dendronv2-${{ hashFiles('**/yarn.lock', '**/package-lock.json') }}

      - name: Install dependencies
        run: yarn

      - name: Initialize or pull nextjs template
        run: |
          (test -d .next) && \
            (echo 'updating dendron next...' && cd .next && git reset --hard && git pull && yarn && cd ..) || \
            (echo 'init dendron next' && yarn dendron publish init)

      - name: Restore Next cache
        uses: actions/cache@v4
        with:
          path: .next/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('.next/yarn.lock', '.next/package-lock.json') }}-${{ hashFiles('.next/**.[jt]s', '.next/**.[jt]sx') }}

      - name: Export notes
        run: yarn dendron publish export --target github --yes

      - name: Deploy site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: docs/
          force_orphan: true
